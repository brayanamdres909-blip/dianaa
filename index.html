<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana Alejandra ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
    color:white;
}

/* INTRO */
#intro{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:10;

    background-image:url("diana.jpg");
    background-size:cover;
    background-position:center;
}

#intro::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

#intro h1{ font-size:42px; color:#ff9bb3; }
#intro p{ max-width:320px; color:#eee; margin:15px; }

#intro button{
    padding:12px 25px;
    border:1px solid pink;
    background:none;
    color:white;
    cursor:pointer;
    border-radius:20px;
}

/* CARD */
#card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.9);
    padding:20px;
    border-radius:15px;
    text-align:center;
    display:none;
    max-width:320px;
    border:1px solid #ff9bb3;
    z-index:5;
}

#card h2{ color:#ff9bb3; }

#card button{
    margin-top:10px;
    padding:8px 15px;
    background:none;
    border:1px solid white;
    color:white;
    cursor:pointer;
}

canvas{ display:block; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="intro">
<h1>Diana Alejandra 💖</h1>
<p>La más hermosa, la más preciosa… mi universo completo.</p>
<button id="btnStart">Entrar a nuestro universo</button>
</div>

<div id="card">
<h2 id="title"></h2>
<p id="text"></p>
<button id="btnClose">Cerrar</button>
</div>

<script type="module">
import * as THREE from 'three';

const frases = [
"Tus ojos verdes que me calman",
"Tu sonrisa que ilumina todo",
"Tu voz en mi mente",
"Tu forma de abrazarme",
"Lo hermosa que eres",
"Tu esencia única",
"Tu forma de ser",
"Tú, simplemente tú",
"Todo lo que eres",
"Mi lugar favorito eres tú"
];

let scene, camera, renderer, objects = [];

/* 🎵 MÚSICA */
let musicFrame = null;

document.getElementById("btnStart").addEventListener("click", start);
document.getElementById("btnClose").addEventListener("click", closeCard);

function start(){

    document.getElementById("intro").style.display = "none";

    /* ===== MÚSICA YOUTUBE ===== */
    musicFrame = document.createElement("iframe");
    musicFrame.src = "https://www.youtube.com/embed/F0rwOsAteXM?autoplay=1&loop=1&playlist=F0rwOsAteXM&controls=0";
    musicFrame.allow = "autoplay";
    musicFrame.style.position = "absolute";
    musicFrame.style.width = "1px";
    musicFrame.style.height = "1px";
    musicFrame.style.left = "-9999px";
    document.body.appendChild(musicFrame);

    /* ===== ESCENA ===== */
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    camera.position.z = 60;

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(1.2,32,32);

    frases.forEach((f)=>{

        const material = new THREE.MeshBasicMaterial({color:0xff6f91});
        const sphere = new THREE.Mesh(geometry, material);

        sphere.position.x = (Math.random()-0.5)*120;
        sphere.position.y = (Math.random()-0.5)*80;
        sphere.position.z = (Math.random()-0.5)*120;

        sphere.userData.text = f;

        scene.add(sphere);
        objects.push(sphere);
    });

    animate();
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click",(e)=>{

    if(!camera) return;

    mouse.x = (e.clientX / window.innerWidth)*2 - 1;
    mouse.y = -(e.clientY / window.innerHeight)*2 + 1;

    raycaster.setFromCamera(mouse,camera);

    const hits = raycaster.intersectObjects(objects);

    if(hits.length > 0){

        const obj = hits[0].object;

        document.getElementById("title").innerText = obj.userData.text;

        document.getElementById("text").innerText =
        "Diana Alejandra… eres mi lugar favorito en el mundo. Todo contigo se siente perfecto.";

        document.getElementById("card").style.display = "block";
    }
});

function closeCard(){
    document.getElementById("card").style.display = "none";
}

function animate(){
    requestAnimationFrame(animate);

    objects.forEach(o=>{
        o.rotation.y += 0.01;
        o.rotation.x += 0.004;
    });

    renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{

    if(!camera) return;

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
