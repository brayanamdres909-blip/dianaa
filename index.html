<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana Alejandra ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
    color:white;
}

/* INTRO */
#intro{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:black;
    z-index:10;
}

#intro h1{
    color:#ff9bb3;
    font-size:40px;
}

#intro p{
    max-width:300px;
    text-align:center;
    color:#ccc;
}

#intro button{
    padding:10px 25px;
    border:1px solid pink;
    background:none;
    color:white;
    cursor:pointer;
    margin-top:15px;
}

/* TARJETA */
#card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.9);
    padding:20px;
    border-radius:15px;
    display:none;
    text-align:center;
    border:1px solid #ff9bb3;
}

#card button{
    margin-top:10px;
    padding:8px 15px;
    background:none;
    border:1px solid white;
    color:white;
    cursor:pointer;
}

/* CANVAS */
canvas{
    display:block;
}
</style>

<!-- THREE IMPORT -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="intro">
<h1>Diana Alejandra</h1>
<p>La más hermosa, la más preciosa… mi universo completo.</p>
<button id="btnStart">Entrar</button>
</div>

<div id="card">
<h2 id="title"></h2>
<p id="text"></p>
<button id="btnClose">Cerrar</button>
</div>

<script type="module">
import * as THREE from 'three';

/* ====== FRASES ====== */
const frases = [
"Tus ojos verdes",
"Tu sonrisa",
"Tu forma de mirarme",
"Tu voz",
"Lo hermosa que eres",
"Tu esencia",
"Tus besos",
"Tu presencia",
"Todo lo que eres",
"Que seas tú, Diana Alejandra"
];

/* ====== VARIABLES ====== */
let scene, camera, renderer, objects = [];

/* ====== BOTONES (CLAVE PARA QUE FUNCIONE) ====== */
const btnStart = document.getElementById("btnStart");
const btnClose = document.getElementById("btnClose");

btnStart.addEventListener("click", start);
btnClose.addEventListener("click", closeCard);

/* ====== INICIO ====== */
function start(){

    document.getElementById("intro").style.display = "none";

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    camera.position.z = 60;

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(1.2,32,32);

    frases.forEach((f)=>{

        const material = new THREE.MeshBasicMaterial({color:0xff6f91});
        const sphere = new THREE.Mesh(geometry, material);

        sphere.position.x = (Math.random()-0.5)*120;
        sphere.position.y = (Math.random()-0.5)*80;
        sphere.position.z = (Math.random()-0.5)*120;

        sphere.userData.text = f;

        scene.add(sphere);
        objects.push(sphere);
    });

    animate();
}

/* ====== CLICK INTERACCIÓN ====== */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click",(e)=>{

    if(!camera) return;

    mouse.x = (e.clientX / window.innerWidth)*2 - 1;
    mouse.y = -(e.clientY / window.innerHeight)*2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const hits = raycaster.intersectObjects(objects);

    if(hits.length > 0){

        const obj = hits[0].object;

        document.getElementById("title").innerText = obj.userData.text;

        document.getElementById("text").innerText =
        "Diana Alejandra… la más hermosa, la más preciosa. Eres la razón por la que todo en mi vida tiene sentido.";

        document.getElementById("card").style.display = "block";
    }
});

/* ====== CERRAR TARJETA ====== */
function closeCard(){
    document.getElementById("card").style.display = "none";
}

/* ====== ANIMACIÓN ====== */
function animate(){
    requestAnimationFrame(animate);

    objects.forEach(o=>{
        o.rotation.y += 0.01;
        o.rotation.x += 0.005;
    });

    renderer.render(scene, camera);
}

/* ====== RESPONSIVE ====== */
window.addEventListener("resize",()=>{

    if(!camera) return;

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
