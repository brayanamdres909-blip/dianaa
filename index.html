<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DIANA ALEJANDRA</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#ffb3c6;
    --secondary:#ff809f;
    --accent:#ffd1dc;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#030102;
    font-family:'Montserrat',sans-serif;
    color:white;
}

#canvas-container{
    position:absolute;
    width:100%;
    height:100%;
    z-index:1;
}

/* PANTALLA PRINCIPAL */
#intro-screen{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:10;

    background-image:url("diana.jpg");
    background-size:cover;
    background-position:center;
}

#intro-screen::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(4px);
}

#intro-screen h1{
    position:relative;
    z-index:2;
    font-size:4rem;
    letter-spacing:6px;
    color:#fff;
    text-shadow:0 0 20px rgba(255,255,255,0.8);
    margin-bottom:25px;
    font-family:'Cormorant Garamond',serif;
}

#btn-enter{
    position:relative;
    z-index:2;
    padding:14px 45px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:1rem;
    letter-spacing:4px;
    backdrop-filter:blur(10px);
    transition:0.4s;
}

#btn-enter:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,0.3);
}

/* TARJETA */
#message-card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:85%;
    max-width:420px;
    padding:40px;
    background:rgba(20,20,20,0.7);
    backdrop-filter:blur(20px);
    border-radius:30px;
    text-align:center;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:0.5s;
}

#message-card.active{
    opacity:1;
    pointer-events:auto;
}

#card-icon{
    font-size:3rem;
    margin-bottom:15px;
}

#card-title{
    color:#ffb3c6;
    margin-bottom:15px;
    letter-spacing:2px;
}

#card-text{
    font-size:1.5rem;
    line-height:1.4;
    margin-bottom:25px;
    font-family:'Cormorant Garamond',serif;
}

#btn-close{
    padding:10px 25px;
    border:none;
    border-radius:30px;
    cursor:pointer;
}

/* PUNTO CENTRO */
#crosshair{
    position:absolute;
    top:50%;
    left:50%;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;
    transform:translate(-50%,-50%);
    z-index:40;
}

</style>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

</head>

<body>

<div id="intro-screen">
    <h1>DIANA ALEJANDRA</h1>
    <button id="btn-enter">EXPLORAR</button>
</div>

<div id="crosshair"></div>

<div id="message-card">
    <div id="card-icon">💖</div>
    <div id="card-title">PARA TI</div>
    <p id="card-text"></p>
    <button id="btn-close">CERRAR</button>
</div>

<div id="canvas-container"></div>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const frases = [
"Mi vida 💖",
"Mi reina 👑",
"Mamasita 😍",
"Cosita linda 💕",
"Mi cielo ✨",
"Mi bebé 🥰",
"Princesita 🌸",
"Bombón 💋",
"Mi tentación ❤️",
"Caramelito 🍬",
"Mi debilidad 💘",
"Mamasota 🔥",
"Mi amor 💞",
"Mi niña 🌷",
"Preciosa 💫",
"Muñequita 🦋",
"Mi tesoro 💎",
"Corazoncito ❤️",
"Mi patrona 😏",
"Mi desastre favorito 😂"
];

const container = document.getElementById('canvas-container');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
55,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 90;

const renderer = new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

const sprites = [];

function createTextSprite(text){

    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;

    const ctx = canvas.getContext('2d');

    ctx.fillStyle = 'rgba(255,255,255,0)';
    ctx.fillRect(0,0,512,512);

    ctx.font = 'bold 42px Arial';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff69b4';
    ctx.shadowBlur = 25;

    ctx.fillText(text,256,256);

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.SpriteMaterial({
        map:texture,
        transparent:true
    });

    const sprite = new THREE.Sprite(material);

    sprite.scale.set(20,20,1);

    return sprite;
}

frases.forEach((frase,i)=>{

    const sprite = createTextSprite(frase);

    const angle = (i/frases.length)*Math.PI*2;

    const radius = 40 + Math.random()*25;

    sprite.position.set(
        Math.cos(angle)*radius,
        (Math.random()-0.5)*40,
        Math.sin(angle)*radius
    );

    sprite.userData = {
        angle:angle,
        radius:radius
    };

    scene.add(sprite);

    sprites.push(sprite);

});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('mousemove',(event)=>{

    mouse.x = (event.clientX/window.innerWidth)*2 -1;
    mouse.y = -(event.clientY/window.innerHeight)*2 +1;

});

window.addEventListener('click',()=>{

    raycaster.setFromCamera(mouse,camera);

    const intersects = raycaster.intersectObjects(sprites);

    if(intersects.length > 0){

        const texto = intersects[0].object.material.map.image
        ? "Eres la persona más hermosa de mi universo ❤️"
        : "";

        document.getElementById('card-text').innerText = texto;

        document.getElementById('message-card')
        .classList.add('active');
    }

});

document.getElementById('btn-close')
.addEventListener('click',()=>{

    document.getElementById('message-card')
    .classList.remove('active');

});

document.getElementById('btn-enter')
.addEventListener('click',()=>{

    document.getElementById('intro-screen')
    .style.display='none';

});

function animate(){

    requestAnimationFrame(animate);

    sprites.forEach((sprite)=>{

        sprite.userData.angle += 0.002;

        sprite.position.x =
        Math.cos(sprite.userData.angle)
        * sprite.userData.radius;

        sprite.position.z =
        Math.sin(sprite.userData.angle)
        * sprite.userData.radius;

    });

    controls.update();

    renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{

    camera.aspect = window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
