<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana Alejandra ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
    color:white;
}

/* INTRO */
#intro{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:10;

    background-image:url("diana.jpg");
    background-size:cover;
    background-position:center;
}

#intro::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

#intro h1{
    font-size:40px;
    color:#ff9bb3;
}

#intro p{
    max-width:300px;
    margin:10px;
}

#intro button{
    padding:10px 20px;
    border:1px solid pink;
    background:none;
    color:white;
    cursor:pointer;
    border-radius:20px;
}

/* TARJETA */
#card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.92);
    padding:20px;
    border-radius:15px;
    text-align:center;
    display:none;
    max-width:350px;
    border:1px solid #ff9bb3;
    z-index:5;
}

#card h2{
    color:#ff9bb3;
}

#card button{
    margin-top:10px;
    padding:8px 15px;
    background:none;
    border:1px solid white;
    color:white;
    cursor:pointer;
}

canvas{
    display:block;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="intro">
<h1>Diana Alejandra 💖</h1>
<p>Un pequeño universo hecho para ti.</p>
<button id="btnStart">Entrar</button>
</div>

<div id="card">
<h2>Diana Alejandra 💖</h2>
<p id="text"></p>
<button id="btnClose">Cerrar</button>
</div>

<script type="module">
import * as THREE from 'three';

/* 💖 FRASES CORREGIDAS Y LIMPIAS */
const frases = [
"Esa sonrisa tuya, que desarma cualquier tristeza y me deja sin defensa.",
"Tu mirada única, que dice más que mil palabras y me encuentra siempre.",
"Tu forma de ser, tan auténtica, que hace que todo a tu alrededor se sienta real.",
"Tu risa real, que suena a felicidad pura y me contagia sin pedir permiso.",
"Tu voz tranquila, que calma mis pensamientos cuando todo se vuelve ruido.",
"Tu energía bonita, que ilumina incluso los días que parecen apagados.",
"Tu forma de hablar, que convierte lo simple en algo que quiero escuchar siempre.",
"Tu calma, que me enseña que el amor también puede ser paz.",
"Tu ternura, que se siente como un abrazo que nunca se quiere soltar.",
"Eres tú, sin esfuerzo, sin filtros, sin nada que sobre.",
"Simplemente tú, y con eso ya me basta para quedarme.",
"Tu alegría, que le pone color a todo lo que antes era gris.",
"Tu forma de ver la vida, que me hace querer quedarme en tu mundo un rato más.",
"Tu espontaneidad, que convierte cualquier momento en algo inolvidable.",
"Tu dulzura, que no se explica, solo se siente y se agradece.",
"Tu esencia, que no se busca… pero cuando llega, se queda para siempre."
];

let scene, camera, renderer, objects = [];

document.getElementById("btnStart").addEventListener("click", start);
document.getElementById("btnClose").addEventListener("click", () => {
    document.getElementById("card").style.display = "none";
});

function start(){

    document.getElementById("intro").style.display = "none";

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    camera.position.z = 60;

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(0.7, 10, 10);

    for(let i=0;i<frases.length;i++){

        const material = new THREE.MeshBasicMaterial({
            color: new THREE.Color().setHSL(Math.random(), 1, 0.6),
            transparent:true,
            opacity:0.9
        });

        const sphere = new THREE.Mesh(geometry, material);

        sphere.position.x = (Math.random()-0.5)*110;
        sphere.position.y = (Math.random()-0.5)*80;
        sphere.position.z = (Math.random()-0.5)*110;

        sphere.userData.text = frases[i];

        scene.add(sphere);
        objects.push(sphere);
    }

    animate();
}

/* CLICK */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click",(e)=>{

    if(!camera) return;

    mouse.x = (e.clientX / window.innerWidth)*2 - 1;
    mouse.y = -(e.clientY / window.innerHeight)*2 + 1;

    raycaster.setFromCamera(mouse,camera);

    const hits = raycaster.intersectObjects(objects);

    if(hits.length > 0){

        document.getElementById("text").innerText =
        hits[0].object.userData.text;

        document.getElementById("card").style.display = "block";
    }
});

/* ANIMACIÓN */
function animate(){
    requestAnimationFrame(animate);

    objects.forEach(o=>{
        o.rotation.y += 0.002;

        const s = 1 + Math.sin(Date.now()*0.002 + o.position.x)*0.2;
        o.scale.set(s,s,s);
    });

    renderer.render(scene,camera);
}

/* RESIZE */
window.addEventListener("resize",()=>{

    if(!camera) return;

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
