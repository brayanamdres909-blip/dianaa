<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIANA ALEJANDRA</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:'Montserrat',sans-serif;
}

/* FONDO */
#canvas-container{
    position:absolute;
    width:100%;
    height:100%;
}

/* PANTALLA INICIO */
#intro-screen{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:url("diana.jpg") center/cover no-repeat;
    z-index:10;
}

#intro-screen::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(4px);
    z-index:1;
    pointer-events:none;
}

#intro-screen h1{
    position:relative;
    z-index:5;
    color:white;
    font-size:4rem;
    letter-spacing:5px;
    margin-bottom:25px;
    font-family:'Cormorant Garamond',serif;
    text-shadow:0 0 20px hotpink;
}

#btn-enter{
    position:relative;
    z-index:5;
    padding:15px 45px;
    border:none;
    border-radius:50px;
    background:rgba(255,255,255,0.2);
    color:white;
    cursor:pointer;
    font-size:1rem;
    letter-spacing:4px;
    transition:0.4s;
    backdrop-filter:blur(10px);
}

#btn-enter:hover{
    transform:scale(1.08);
    background:rgba(255,255,255,0.35);
}

/* TARJETA */
#message-card{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:85%;
    max-width:420px;
    background:rgba(20,20,20,0.75);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:35px;
    text-align:center;
    z-index:30;
    opacity:0;
    pointer-events:none;
    transition:0.5s;
}

#message-card.active{
    opacity:1;
    pointer-events:auto;
}

#card-icon{
    font-size:3rem;
    margin-bottom:15px;
}

#card-title{
    color:#ffb3c6;
    margin-bottom:15px;
    letter-spacing:3px;
    font-size:1.2rem;
}

#card-text{
    color:white;
    font-size:1.5rem;
    line-height:1.4;
    font-family:'Cormorant Garamond',serif;
    margin-bottom:25px;
}

#btn-close{
    padding:10px 25px;
    border:none;
    border-radius:30px;
    cursor:pointer;
}

</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

</head>

<body>

<div id="intro-screen">
    <h1>DIANA ALEJANDRA</h1>
    <button id="btn-enter">EXPLORAR</button>
</div>

<div id="message-card">
    <div id="card-icon">💖</div>
    <div id="card-title">ALEJANDRA</div>
    <div id="card-text"></div>
    <button id="btn-close">CERRAR</button>
</div>

<div id="canvas-container"></div>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const frases = [
"Mi vida 💖",
"Mi reina 👑",
"Mamasita 😍",
"Cosita linda 💕",
"Mi cielo ✨",
"Mi bebé 🥰",
"Princesita 🌸",
"Bombón 💋",
"Mi tentación ❤️",
"Caramelito 🍬",
"Mi debilidad 💘",
"Mamasota 🔥",
"Mi amor 💞",
"Mi niña 🌷",
"Preciosa 💫",
"Muñequita 🦋"
];

const mensajes = [
"Eres lo mejor que me ha pasado ❤️",
"Tu sonrisa ilumina mi universo ✨",
"No cambio tus abrazos por nada 💖",
"Eres mi lugar favorito 🌸",
"Cada día contigo es especial 💕",
"Mi vida tiene más sentido contigo 💫",
"Siempre voy a elegirte ❤️"
];

const container = document.getElementById("canvas-container");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 90;

const renderer = new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);

controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

/* ESTRELLAS */

const starsGeometry = new THREE.BufferGeometry();

const starVertices = [];

for(let i=0;i<3000;i++){

    const x = (Math.random()-0.5)*2000;
    const y = (Math.random()-0.5)*2000;
    const z = (Math.random()-0.5)*2000;

    starVertices.push(x,y,z);
}

starsGeometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(starVertices,3)
);

const starsMaterial = new THREE.PointsMaterial({
color:0xffffff,
size:1
});

const stars = new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

/* TEXTOS */

const sprites = [];

function createTextSprite(text){

    const canvas = document.createElement('canvas');

    canvas.width = 512;
    canvas.height = 512;

    const ctx = canvas.getContext('2d');

    ctx.font = 'bold 42px Arial';

    ctx.fillStyle = 'white';

    ctx.textAlign = 'center';

    ctx.shadowColor = '#ff69b4';
    ctx.shadowBlur = 25;

    ctx.fillText(text,256,256);

    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.SpriteMaterial({
        map:texture,
        transparent:true
    });

    const sprite = new THREE.Sprite(material);

    sprite.scale.set(20,20,1);

    return sprite;
}

frases.forEach((frase,i)=>{

    const sprite = createTextSprite(frase);

    const angle = (i/frases.length)*Math.PI*2;

    const radius = 40 + Math.random()*20;

    sprite.position.set(
        Math.cos(angle)*radius,
        (Math.random()-0.5)*40,
        Math.sin(angle)*radius
    );

    sprite.userData = {
        angle:angle,
        radius:radius
    };

    scene.add(sprite);

    sprites.push(sprite);

});

/* INTERACCION */

const raycaster = new THREE.Raycaster();

const mouse = new THREE.Vector2();

window.addEventListener('mousemove',(event)=>{

    mouse.x = (event.clientX/window.innerWidth)*2 -1;
    mouse.y = -(event.clientY/window.innerHeight)*2 +1;

});

window.addEventListener('click',()=>{

    raycaster.setFromCamera(mouse,camera);

    const intersects = raycaster.intersectObjects(sprites);

    if(intersects.length > 0){

        const randomMessage =
        mensajes[Math.floor(Math.random()*mensajes.length)];

        document.getElementById('card-text').innerText =
        randomMessage;

        document.getElementById('message-card')
        .classList.add('active');
    }

});

document.getElementById('btn-close')
.addEventListener('click',()=>{

    document.getElementById('message-card')
    .classList.remove('active');

});

/* BOTON */

document.getElementById('btn-enter')
.addEventListener('click',()=>{

    document.getElementById('intro-screen')
    .style.display='none';

});

/* ANIMACION */

function animate(){

    requestAnimationFrame(animate);

    sprites.forEach((sprite)=>{

        sprite.userData.angle += 0.002;

        sprite.position.x =
        Math.cos(sprite.userData.angle)
        * sprite.userData.radius;

        sprite.position.z =
        Math.sin(sprite.userData.angle)
        * sprite.userData.radius;

    });

    controls.update();

    renderer.render(scene,camera);

}

animate();

/* RESPONSIVE */

window.addEventListener('resize',()=>{

    camera.aspect =
    window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
    window.innerWidth,
    window.innerHeight
    );

});

</script>

</body>
</html>
